<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15120d" />
  <title>AFTERFALL — 생존자들의 마지막 보루</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 타이틀 -->
  <section id="title-screen" class="screen active">
    <div class="title-box">
      <div class="title-brand">AFTERFALL</div>
      <div class="title-tag">생존자들의 마지막 보루</div>
      <p class="tagline">탐사로 얻고, 파밍으로 욕심내고, 쉘터 방어로 대가를 치른다.</p>
      <div class="title-buttons">
        <button id="btn-new" class="btn-primary">새 게임</button>
        <button id="btn-continue" class="btn-ghost">이어하기</button>
      </div>
      <div id="title-auth" class="title-auth"></div>
      <p class="hint">하루 3장의 타로 카드로 위험과 보상을 조정하며 캠프를 유지하세요.</p>
    </div>
  </section>

  <!-- 게임 셸 -->
  <div id="app" class="app">
    <!-- 상단바 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">AFTERFALL</div>
        <div class="brand-tag">생존자들의 마지막 보루</div>
      </div>
      <div class="day-block">
        <span class="day-num" id="day-num">DAY 1</span>
        <span class="day-sub" id="day-sub">18:00 · 흐림</span>
      </div>
      <div class="resources" id="resource-bar"></div>
      <div class="topbar-actions">
        <div id="auth-chip" class="auth-chip"></div>
        <button id="btn-bell" class="icon-btn bell" title="알림">🔔<span id="bell-badge" class="bell-badge" hidden></span></button>
        <button id="btn-save" class="icon-btn" title="저장">💾</button>
        <button id="btn-menu" class="icon-btn" title="메뉴">⚙</button>
      </div>
    </header>

    <!-- 사이드바 -->
    <aside class="sidebar">
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><div class="watchtower">🗼</div></div>
    </aside>

    <!-- 화면 -->
    <main class="main">
      <div id="view-root"></div>
    </main>
  </div>

  <!-- 리포트 모달 -->
  <div id="report-modal" class="modal">
    <div class="modal-box report-box">
      <h2 id="report-title">DAY 1 야간 보고</h2>
      <div id="report-body"></div>
      <button id="btn-report-close" class="btn-primary">다음 날로 ▶</button>
    </div>
  </div>

  <!-- 게임오버 모달 -->
  <div id="over-modal" class="modal">
    <div class="modal-box">
      <h2 id="over-title">캠프 붕괴</h2>
      <p id="over-body"></p>
      <button id="btn-over-restart" class="btn-primary">다시 시작</button>
    </div>
  </div>

  <!-- 기록 모달 (사용 안 함, 기록은 화면으로 대체) -->
  <div id="records-modal" class="modal">
    <div class="modal-box">
      <h2>📜 내 기록</h2>
      <div id="records-body"></div>
      <button id="btn-records-close" class="btn-primary">닫기</button>
    </div>
  </div>

  <!-- 메뉴 모달 -->
  <div id="menu-modal" class="modal">
    <div class="modal-box">
      <h2>메뉴</h2>
      <div class="menu-actions">
        <button id="btn-menu-save" class="btn-ghost">저장</button>
        <button id="btn-menu-help" class="btn-ghost">도움말 / 규칙</button>
        <button id="btn-menu-quit" class="btn-ghost">타이틀로</button>
        <button id="btn-menu-close" class="btn-primary">닫기</button>
      </div>
      <div id="help-box" class="help-box" hidden></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
