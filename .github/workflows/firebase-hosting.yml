# Firebase Hosting 자동 배포
# private 저장소에서도 동작합니다. 저장소 Secret 하나만 설정하면 됩니다:
#   Secret:  FIREBASE_SERVICE_ACCOUNT  (Firebase 서비스 계정 키 JSON 전체)
# 프로젝트 ID(survival-e6d7b)는 공개 안전값이라 아래에 직접 지정했습니다.

name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master, "claude/vibrant-lamport-utpfip"]
  workflow_dispatch: {}   # 액션 탭에서 수동 실행 가능

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: survival-e6d7b
          channelId: live
